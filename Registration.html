<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <link href="css/registration.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4">Register</h3>

                        <!-- Role Selection as Cards -->
                        <div class="mb-4 text-center">
                            <div class="d-flex justify-content-around">
                                <div id="employeeCard" class="role-card p-3 rounded text-center" onclick="selectRole('employee')">
                                    <i class="bi bi-person"></i>
                                    <div>Employee</div>
                                </div>
                                <div id="employerCard" class="role-card p-3 rounded text-center" onclick="selectRole('employer')">
                                    <i class="bi bi-building"></i>
                                    <div>Employer</div>
                                </div>
                            </div>
                        </div>

                        <!-- Registration Form -->
                        <form>
                            <input type="hidden" id="role" value="employee">

                            <div class="mb-3">
                                <label for="fullname" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullname" placeholder="Enter your name" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter email" required>
                            </div>

                            <div class="mb-3">did
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                            </div>

                            <!-- Employee Fields -->
                            <div id="employeeFields">
                                <div class="mb-3">
                                    <label for="jobTitle" class="form-label">Job Title</label>
                                    <input type="text" class="form-control" id="jobTitle" placeholder="e.g. Web Developer">
                                </div>
                            </div>

                            <!-- Employer Fields -->
                            <div id="employerFields" style="display: none;">
                                <div class="mb-3">
                                    <label for="companyName" class="form-label">Company Name</label>
                                    <input type="text" class="form-control" id="companyName" placeholder="Enter your company name">
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Register</button>
                            </div>
                        </form>

                        <div class="text-center mt-3">
                            <small>Already have an account? <a href="login.html">Login</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/registration.js"></script>

</body>
</html>
